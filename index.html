<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7256c3" />
    <meta name="description" content="PingX - Ultra-fast real-time messaging, instant smart facts, and live multi-merchant price comparison." />
    <title>PingX — Real-Time Messaging & Smart Commerce</title>
    <style>
      #root:empty {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f7ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .pingx-boot-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .pingx-boot-logo {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(135deg, #7256c3 0%, #4f46e5 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-weight: 900;
        font-size: 24px;
        box-shadow: 0 10px 25px -5px rgba(114, 86, 195, 0.4);
        animation: pulse 1.8s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pingx-boot-loader">
        <div class="pingx-boot-logo">PX</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
